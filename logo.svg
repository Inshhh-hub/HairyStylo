      <path d="M256 330L166 92c-4-12-16-8-14 6L220 336z" fill="#e9defc"/>
      <path d="M256 330L346 92c4-12 16-8 14 6L292 336z" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
      <ellipse cx="204" cy="402" rx="44" ry="52" transform="rotate(24 204 402)" fill="none" stroke="url(#fire)" stroke-width="26"/>
      <ellipse cx="308" cy="402" rx="44" ry="52" transform="rotate(-24 308 402)" fill="none" stroke="url(#fire)" stroke-width="26"/>
