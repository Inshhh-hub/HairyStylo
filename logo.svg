<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1740"/><stop offset="1" stop-color="#120a1d"/></linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff5c9a"/><stop offset=".55" stop-color="#ff8f6b"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9b8ff"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#ff6fa5" stop-opacity=".5"/><stop offset="1" stop-color="#ff6fa5" stop-opacity="0"/></radialGradient>
    <clipPath id="rr"><rect width="512" height="512" rx="118"/></clipPath>
